<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Lehuye Artist List</title>
  <style>
    :root {
      --header-hight: 120px;
      --footer-hight: 52px;
    }
    ul {
      list-style: none;
      padding: 0;
      max-width: 1200px;
      margin: 16px auto 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .artist-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: #151518;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .artist-card:hover {
      border-color: #00dfd8;
    }
    .artist-card .preview-img {
      width: 100%;
      aspect-ratio: 1/1;
      overflow: hidden;
      object-fit: cover;
      cursor: pointer;
      background: #0b0b0f;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 13px;
    }
    .artist-card .text-item {
      font-size: 12px;
      color: #eee;
      padding: 6px 10px;
    }
    .artist-card .uid-item {
      font-size: 18px;
      color: #eee;
      padding: 6px 10px;
    }
    .copy {
      cursor: copy;
      transition: all .3s ease-in-out;
    }
    .copy:hover {
      background-color: rgb(66, 66, 66);
    }
    #fileInput {
      display: none;
    }
    header {
      width: 100vw;
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.12);
      position: fixed;
      height: var(--header-hight);
    }
    .header {
      font-size: 14px;
      font-weight: lighter;
      width: 1200px;
      margin: auto;
      display: flex;
      padding: 32px 0 12px;
      justify-content: space-between;
      color: #fff;
    }
    main {
      padding-top: var(--header-hight);
      height: calc(100vh - var(--header-hight) - var(--footer-hight));
      overflow: auto;
    }
    main::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    main::-webkit-scrollbar-track {
      background: transparent;
    }
    main::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 3px;
    }
    main:hover::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.22);
    }
    main::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.35);
    }
    footer {
      height: var(--footer-hight);
    }
    body {
      background: #0b0b0f;
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    .bar {
      display: flex;
      gap: 16px;
    }
    .bar span {
      display: flex;
      border-radius: 8px;
      background: rgb(3, 49, 83);
      padding: 4px 16px;
    }
    .filter-wrap {
      max-width: 1200px;
      margin: 0 auto 16px;
    }
    #searchInput {
      width: 100%;
      box-sizing: border-box;
      background: #151518;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #eee;
      padding: 10px 14px;
      outline: none;
      font-size: 13px;
    }
    #searchInput:focus {
      border-color: #00dfd8;
    }
    #searchInput::placeholder {
      color: #64748b;
    }
    .remind {
      color:#aaa;
      padding:12px;
      font-size:13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header">
      <div>
        <svg width="141" height="11" viewBox="0 0 141 11" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 11V0H9V6H14V9H21V11H0Z" fill="white"></path>
          <path d="M45 9V11H24V0H45V6H38V2H33V7H38V9H45Z" fill="white"></path>
          <path d="M48 11V0H57V6H62V0H69V11H62V9H57V11H48Z" fill="white"></path>
          <path d="M72 11V0H81V9H86V0H93V11H86H81H72Z" fill="white"></path>
          <path d="M96 9V0H105V6H110V0H117V9V11H110V9H105H96Z" fill="white"></path>
          <path d="M141 9V11H120V0H141V6H134V2H129V7H134V9H141Z" fill="white"></path>
        </svg>
      </div>
      <div class="bar">
        <span>Global Artists</span>
        <span>Skill Download</span>
        <span onclick="这个要写一个弹窗去添加对应的，调用你刚刚写的那个api，去添加新的painter">Add Painter</span>
      </div>
    </div>
    <div class="filter-wrap">
      <input id="searchInput" placeholder="搜索 UID / 英文名 / 中文名 / 国家">
    </div>
  </header>
  <main>
    <ul id="list"></ul>
  </main>
  <footer>
    <div class="remind" id="remind"></div>
  </footer>
  <input type="file" id="fileInput" accept="image/*">
  <script>
    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const remind = document.getElementById('remind')
    const ul = document.getElementById('list');
    let currentPainter = null;
    let painters_data = [];
    let remindTimer = null;

    async function copyText(txt) {
      try {
        await navigator.clipboard.writeText(txt);
        remind.innerText = '已复制：' + txt
      } catch (err) {
        remind.innerText = '复制失败：' + txt
      }
      clearTimeout(remindTimer);
      remindTimer = setTimeout(()=> remind.innerText = '', 3000);
    }

    (async () => {
      const resp = await fetch('/api/painters');
      painters_data = await resp.json();
      // birth_8 倒序，出生年份晚（数字大）排在前面
      painters_data.sort((a, b) => Number(b.birth_8) - Number(a.birth_8));
      renderList(painters_data);

      searchInput.oninput = (e) => {
        const kw = e.target.value.trim().toLowerCase();
        if (!kw) {
          renderList(painters_data);
          return;
        }
        let filtered = painters_data.filter(p => {
          const str = `${p.unique_code} ${p.en_name} ${p.cn_name} ${p.country_name}`.toLowerCase();
          return str.includes(kw);
        });
        filtered.sort((a, b) => Number(b.birth_8) - Number(a.birth_8));
        renderList(filtered);
      }
    })()

    function renderList(list) {
      ul.innerHTML = '';
      list.forEach(p => {
        const li = document.createElement('li');
        li.className = 'artist-card';
        const thumbUrl = `/images/thumb/${p.unique_code}.webp`;
        li.innerHTML = `
      <div class="preview-img" data-code="${p.unique_code}">
        <img src="${thumbUrl}" onerror="this.parentElement.textContent='暂无图片';this.remove()">
      </div>
      <div class="uid-item copy">${p.unique_code}</div>
      <div class="text-item copy">${p.en_name}</div>
      <div class="text-item copy">${p.cn_name}</div>
      <div class="text-item copy">${p.country_name}</div>
    `;
        li.querySelector('.preview-img').onclick = () => {
          currentPainter = p;
          fileInput.click();
        };
        li.querySelectorAll('.copy').forEach(el => {
          el.onclick = (ev) => {
            ev.stopPropagation();
            copyText(el.innerText.trim());
          };
        });
        ul.appendChild(li);
      })
    }

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || !currentPainter) return;
      const form = new FormData();
      form.append('imgfile', file);
      form.append('unique_code', currentPainter.unique_code);
      const res = await fetch('/api/upload', {
        method: 'POST',
        body: form
      });
      const ret = await res.json();
      if (ret.ok) {
        remind.innerText = '上传成功，已生成缩略图';
        clearTimeout(remindTimer);
        remindTimer = setTimeout(()=> remind.innerText = '', 3000);
        const cardImgWrap = document.querySelector(`.preview-img[data-code="${currentPainter.unique_code}"]`);
        if (cardImgWrap) {
          cardImgWrap.innerHTML = `<img src="${ret.urls.thumb}" onerror="this.parentElement.textContent='暂无图片';this.remove()">`;
        }
      } else {
        remind.innerText = '上传失败：' + ret.msg;
        clearTimeout(remindTimer);
        remindTimer = setTimeout(()=> remind.innerText = '', 3000);
      }
      fileInput.value = '';
    }
  </script>
</body>
</html>
