<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Lehuye Artist List</title>
  <link rel="stylesheet" href="/style.css">

</head>

<body>
  <header>
    <div class="header">
      <div>
        <svg width="141" height="11" viewBox="0 0 141 11" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 11V0H9V6H14V9H21V11H0Z" fill="white"></path>
          <path d="M45 9V11H24V0H45V6H38V2H33V7H38V9H45Z" fill="white"></path>
          <path d="M48 11V0H57V6H62V0H69V11H62V9H57V11H48Z" fill="white"></path>
          <path d="M72 11V0H81V9H86V0H93V11H86H81H72Z" fill="white"></path>
          <path d="M96 9V0H105V6H110V0H117V9V11H110V9H105H96Z" fill="white"></path>
          <path d="M141 9V11H120V0H141V6H134V2H129V7H134V9H141Z" fill="white"></path>
        </svg>
      </div>
      <div class="bar">
        <span>Global Artists</span>
        <span>Skill Download</span>
        <span id="btnAdd">Add Painter</span>
      </div>
    </div>
    <div class="filter-wrap">
      <input id="searchInput" placeholder="搜索 UID / 英文名 / 中文名 / 国家">
    </div>
  </header>
  <main>
    <ul id="list"></ul>
  </main>
  <footer>
    <div class="remind" id="remind"></div>
  </footer>
  <input type="file" id="fileInput" accept="image/*">


  <!-- 添加/编辑画家弹窗 -->
  <div class="modal-mask" id="modal">
    <h3 id="modalTitle">新增艺术家</h3>
    <div class="modal-box">
      <div class="modal-left">
      <textarea id="jsonImport" rows="8" placeholder=""></textarea>
</div>
      <div class="modal-right">
        <div class="form-row">
          <label>国家</label>
          <div class="combobox-wrap">
            <input id="selCountryInput" type="text" autocomplete="off" placeholder="输入筛选国家">
            <div class="combobox-dropdown" id="countryDropdown"></div>
          </div>
        </div>

        <div class="form-row">
          <label>中文名</label>
          <input id="cnName" type="text">
        </div>
        <div class="form-row">
          <label>英文名</label>
          <input id="enName" type="text">
        </div>
        <div class="form-row">
          <label>birth_8（8位数字，例如 14550101）</label>
          <input id="birth8" type="text">
        </div>
        <div class="form-row">
          <label>简介 desc</label>
          <textarea id="desc" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="btnCancel">取消</button>
          <button class="btn-submit" id="btnSubmit">提交</button>
        </div>
      </div>
    </div>
  </div>


  <script>
    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const remind = document.getElementById('remind')
    const ul = document.getElementById('list');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const selCountryInput = document.getElementById('selCountryInput');
    const countryDropdown = document.getElementById('countryDropdown');
    const cnName = document.getElementById('cnName');
    const enName = document.getElementById('enName');
    const birth8 = document.getElementById('birth8');
    const desc = document.getElementById('desc');
    const btnAdd = document.getElementById('btnAdd');
    const btnCancel = document.getElementById('btnCancel');
    const btnSubmit = document.getElementById('btnSubmit');
    const jsonImport = document.getElementById('jsonImport');
    let currentPainter = null; // 上传图片用
    let editTarget = null; // 编辑模式：不为 null 代表编辑，存 painter 对象
    let painters_data = [];
    let countryList = [];
    let remindTimer = null;
    let selectedCountryName = '';

    async function copyText(txt) {
      try {
        await navigator.clipboard.writeText(txt);
        remind.innerText = '已复制：' + txt
      } catch (err) {
        remind.innerText = '复制失败：' + txt
      }
      clearTimeout(remindTimer);
      remindTimer = setTimeout(() => remind.innerText = '', 3000);
    }
    function showRemind(text) {
      remind.innerText = text;
      clearTimeout(remindTimer);
      remindTimer = setTimeout(() => remind.innerText = '', 3000);
    }

    // 渲染下拉选项
    function renderCountryDropdown(filterTxt = '') {
      countryDropdown.innerHTML = '';
      const kw = filterTxt.toLowerCase().trim();
      const filtered = countryList.filter(c => {
        const label = `${c.country_numeric} - ${c.country_name} (${c.country_alpha2})`.toLowerCase();
        return label.includes(kw);
      });
      if (filtered.length === 0) {
        countryDropdown.classList.remove('show');
        return;
      }
      filtered.forEach(c => {
        const div = document.createElement('div');
        div.className = 'opt-item';
        div.innerText = `${c.country_numeric} - ${c.country_name} (${c.country_alpha2})`;
        div.dataset.name = c.country_name;
        div.onclick = () => {
          selectedCountryName = c.country_name;
          selCountryInput.value = div.innerText;
          countryDropdown.classList.remove('show');
        };
        countryDropdown.appendChild(div);
      })
      countryDropdown.classList.add('show');
    }

    async function loadCountries() {
      const res = await fetch('/api/countries');
      countryList = await res.json();
    }

    async function loadPainters() {
      const resp = await fetch('/api/painters');
      painters_data = await resp.json();
      painters_data.sort((a, b) => Number(b.birth_8) - Number(a.birth_8));
      renderList(painters_data);
    }
    function renderList(list) {
      ul.innerHTML = '';
      list.forEach(p => {
        const li = document.createElement('li');
        li.className = 'artist-card';
        const thumbUrl = `/images/thumb/${p.unique_code}.webp`;
        li.innerHTML = `
            <div class="preview-img" data-code="${p.unique_code}">
                <img src="${thumbUrl}" onerror="this.style.display='none'">
            </div>
            <div class="uid-item copy">${p.unique_code}</div>
            <div class="text-item copy">${p.en_name}</div>
            <div class="text-item copy">${p.cn_name}</div>
            <div class="text-item copy">${p.country_name}</div>
            <div class="btn-row">
                <button class="-btn btn-edit" data-uid="${p.unique_code}">编辑</button>
                <button class="-btn btn-del" data-uid="${p.unique_code}">删除</button>
            </div>
          `;
        li.querySelector('.preview-img').onclick = () => {
          currentPainter = p;
          fileInput.click();
        };
        li.querySelectorAll('.copy').forEach(el => {
          el.onclick = (ev) => {
            ev.stopPropagation();
            copyText(el.innerText.trim());
          };
        });
        // 编辑按钮
        li.querySelector('.btn-edit').onclick = () => {
          openEdit(p);
        };
        // 删除按钮
        li.querySelector('.btn-del').onclick = async () => {
          if (!confirm(`确认删除【${p.cn_name} / ${p.en_name}】？`)) return;
          try {
            const res = await fetch('/api/delpainter', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ unique_code: p.unique_code })
            });
            const ret = await res.json();
            if (ret.ok) {
              showRemind('删除成功');
              await loadPainters();
            } else {
              showRemind('删除失败：' + ret.msg);
            }
          } catch (e) {
            showRemind('删除请求异常');
          }
        };
        ul.appendChild(li);
      })
    }
    // 打开编辑弹窗，回填数据
    function openEdit(p) {
      editTarget = p;
      modalTitle.innerText = '编辑艺术家';
      jsonImport.value = '';
      selectedCountryName = p.country_name;
      // 找到对应国家展示文本回填输入框
      const findItem = countryList.find(c => c.country_name === p.country_name);
      if (findItem) {
        selCountryInput.value = `${findItem.country_numeric} - ${findItem.country_name} (${findItem.country_alpha2})`;
      } else {
        selCountryInput.value = p.country_name;
      }
      cnName.value = p.cn_name;
      enName.value = p.en_name;
      birth8.value = p.birth_8;
      desc.value = p.desc;
      countryDropdown.classList.remove('show');
      modal.style.display = 'flex';
    }
    // 打开新增弹窗
    function openAdd() {
      editTarget = null;
      modalTitle.innerText = '新增艺术家';
      jsonImport.value = '';
      cnName.value = '';
      enName.value = '';
      birth8.value = '';
      desc.value = '';
      if (countryList.length > 0) {
        const first = countryList[0];
        selectedCountryName = first.country_name;
        selCountryInput.value = `${first.country_numeric} - ${first.country_name} (${first.country_alpha2})`;
      } else {
        selectedCountryName = '';
        selCountryInput.value = '';
      }
      countryDropdown.classList.remove('show');
      modal.style.display = 'flex';
    }
    // JSON解析函数
    function parseJsonFillForm() {
      const raw = jsonImport.value.trim();
      if (!raw) return;
      try {
        const fixJson = raw.replace(/,\s*}/g, '}').replace(/,\s*]/g, ']');
        const data = JSON.parse(fixJson);

        const countryItem = countryList.find(c => c.country_name === data.country_name);
        if (countryItem) {
          selectedCountryName = countryItem.country_name;
          selCountryInput.value = `${countryItem.country_numeric} - ${countryItem.country_name} (${countryItem.country_alpha2})`;
        } else {
          selectedCountryName = data.country_name;
          selCountryInput.value = data.country_name;
        }

        cnName.value = data.cn_name || '';
        enName.value = data.en_name || '';
        birth8.value = data.birth_8 || '';
        desc.value = data.desc || '';
        showRemind("✅ JSON解析成功，已自动填充表单");
      } catch (e) {
        showRemind("❌ JSON格式错误，请检查语法");
        console.error("json parse error:", e);
      }
    }
    // 失焦触发解析
    jsonImport.onblur = parseJsonFillForm;

    // 弹窗控制
    btnAdd.onclick = openAdd;
    btnCancel.onclick = () => {
      modal.style.display = 'none';
    }
    // 输入框过滤
    selCountryInput.oninput = () => {
      renderCountryDropdown(selCountryInput.value);
    }
    selCountryInput.onfocus = () => {
      renderCountryDropdown(selCountryInput.value);
    }
    // 点击页面空白关闭下拉
    document.addEventListener('click', (e) => {
      if (!selCountryInput.parentElement.contains(e.target)) {
        countryDropdown.classList.remove('show');
      }
    })
    // 提交：区分新增 / 编辑
    btnSubmit.onclick = async () => {
      if (!selectedCountryName) {
        showRemind('请选择国家');
        return;
      }
      const payload = {
        country_name: selectedCountryName,
        cn_name: cnName.value.trim(),
        en_name: enName.value.trim(),
        birth_8: birth8.value.trim(),
        desc: desc.value.trim()
      };
      if (!payload.cn_name || !payload.en_name || !payload.birth_8 || !payload.desc) {
        showRemind('中文名、英文名、birth_8、简介 必填');
        return;
      }
      if (!/^\d{8}$/.test(payload.birth_8)) {
        showRemind('birth_8 必须是8位数字');
        return;
      }
      try {
        let res, ret;
        if (editTarget) {
          res = await fetch('/api/putpainter', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              unique_code: editTarget.unique_code,
              cn_name: payload.cn_name,
              en_name: payload.en_name,
              birth_8: payload.birth_8,
              desc: payload.desc
            })
          });
          ret = await res.json();
        } else {
          res = await fetch('/api/addpainter', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          ret = await res.json();
        }
        if (ret.ok) {
          showRemind(editTarget ? '编辑成功' : `新增成功，UID：${ret.data.unique_code}`);
          modal.style.display = 'none';
          if (editTarget) {
            const idx = painters_data.findIndex(x => x.unique_code === editTarget.unique_code);
            if (idx > -1) painters_data[idx] = ret.data;
            editTarget = null;
          } else {
            painters_data.push(ret.data);
          }
          painters_data.sort((a, b) => Number(b.birth_8) - Number(a.birth_8));
          renderList(painters_data);
        } else {
          showRemind('失败：' + ret.msg);
        }
      } catch (err) {
        console.error(err);
        showRemind('网络请求异常：' + err.message);
      }
    }
    // 图片上传
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || !currentPainter) return;
      const form = new FormData();
      form.append('img', file);
      form.append('unique_code', currentPainter.unique_code);
      const res = await fetch('/api/upload', {
        method: 'POST',
        body: form
      });
      const ret = await res.json();
      if (ret.ok) {
        showRemind('上传成功，已生成缩略图');
        const newCode = ret.unique_code;
        const cardImgWrap = document.querySelector(`.preview-img[data-code="${newCode}"]`);
        if (cardImgWrap) {
          cardImgWrap.innerHTML = `<img src="/images/thumb/${newCode}.webp" onerror="this.style.display='none'">`;
        }
      } else {
        showRemind('上传失败：' + ret.msg);
      }
      fileInput.value = '';
    }
    // 搜索
    searchInput.oninput = (e) => {
      const kw = e.target.value.trim().toLowerCase();
      if (!kw) {
        renderList(painters_data);
        return;
      }
      let filtered = painters_data.filter(p => {
        const str = `${p.unique_code} ${p.en_name} ${p.cn_name} ${p.country_name}`.toLowerCase();
        return str.includes(kw);
      });
      filtered.sort((a, b) => Number(b.birth_8) - Number(a.birth_8));
      renderList(filtered);
    }
    // 初始化
    (async () => {
      await loadCountries();
      await loadPainters();
    })()

  </script>

</body>

</html>
